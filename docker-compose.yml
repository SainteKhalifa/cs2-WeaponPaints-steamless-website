# Everything specific to a deployment lives in .env, which git ignores.
# Start from .env.example to create it.

services:
  cs2-loadout-web:
    build: .
    image: cs2-loadout-web
    container_name: ${CONTAINER_NAME:-cs2-loadout-web}
    restart: unless-stopped

    # Live editing of the code. Comment this out to serve only what was copied
    # into the image at build time.
    volumes:
      - ./:/var/www/html

    # class/config.php reads these, so no credential ends up in a tracked file.
    environment:
      TZ: ${TZ:-Europe/Paris}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      SITE_ACCESS_PASSWORD: ${SITE_ACCESS_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WEB_STYLE_DARK: ${WEB_STYLE_DARK:-true}
      ENABLE_SKIN_FUSION: ${ENABLE_SKIN_FUSION:-true}
      LOCK_STATTRAK_COUNT: ${LOCK_STATTRAK_COUNT:-false}

    networks:
      - cs2
      - traefik

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.middlewares=${TRAEFIK_MIDDLEWARES}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.rule=Host(`${SITE_DOMAIN}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.tls=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.tls.options=${TRAEFIK_TLS_OPTIONS}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.${TRAEFIK_ROUTER}.loadbalancer.server.port=80"

networks:
  cs2:
    external: true
    name: ${CS2_NETWORK}
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
