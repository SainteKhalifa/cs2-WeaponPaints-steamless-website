# Everything specific to a deployment lives in .env, which git ignores.
# Start from .env.example to create it.

services:
  # The service key is internal to compose; CONTAINER_NAME renames both the
  # image and the container, so a deployment never has to edit this file.
  cs2-skin-web:
    build: .
    image: ${CONTAINER_NAME:-cs2-skin-web}
    container_name: ${CONTAINER_NAME:-cs2-skin-web}
    restart: unless-stopped

    # Live editing of the code. Comment this out to serve only what was copied
    # into the image at build time.
    volumes:
      - ./:/var/www/html

    # config.php reads these, so no credential ends up in a tracked file. Site
    # name, language, theme, fusion and the server address are absent on purpose:
    # the Site Settings dialog writes those into config.php, and a variable here
    # would silently win over whatever the administrator had just saved.
    environment:
      TZ: ${TZ:-Europe/Paris}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      SITE_ACCESS_PASSWORD: ${SITE_ACCESS_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LOCK_STATTRAK_COUNT: ${LOCK_STATTRAK_COUNT:-false}
      # Optional, and only forwarded so that setting them in .env has an
      # effect: an unset variable falls through to the default in config.php.
      AUTH_RATE_LIMIT_ATTEMPTS: ${AUTH_RATE_LIMIT_ATTEMPTS:-}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-}
      AUTH_RATE_LIMIT_LOCK_SECONDS: ${AUTH_RATE_LIMIT_LOCK_SECONDS:-}

    networks:
      - cs2
      - traefik

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.middlewares=${TRAEFIK_MIDDLEWARES}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.rule=Host(`${SITE_DOMAIN}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.tls=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.tls.options=${TRAEFIK_TLS_OPTIONS}"
      - "traefik.http.routers.${TRAEFIK_ROUTER}.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.${TRAEFIK_ROUTER}.loadbalancer.server.port=80"

networks:
  cs2:
    external: true
    name: ${CS2_NETWORK}
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
