# Vhost for the loadout manager. TLS and the HTTP redirect are handled by the
# reverse proxy in front, so this only serves plain HTTP on the internal network.

# The proxy terminates TLS, yet the application still needs to know it is on HTTPS.
map $http_x_forwarded_proto $forwarded_https {
    default '';
    https    on;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # The reverse proxy is the only thing that can reach this container: the
    # compose file publishes no port, so nginx is reachable on the Docker
    # networks alone. Without this, REMOTE_ADDR is the proxy for every visitor
    # and the login throttling in class/auth.php treats all players as one
    # client, so five wrong tries by anybody lock everybody out.
    # Only these ranges are trusted, otherwise a forged X-Forwarded-For would
    # let a client pick its own identity and sidestep the limit entirely.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /var/www/html;
    index index.php;

    charset utf-8;
    client_max_body_size 2m;

    # The skin and sticker lists weigh several megabytes and are fetched by the
    # browser: without compression, every time the sticker picker opens it
    # transfers close to 4 MB.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/css image/svg+xml application/javascript;

    # HEALTHCHECK probe, shipped in the image and kept outside the web root so a
    # bind mount cannot shadow it.
    location = /healthz {
        access_log off;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/health.php;
    }

    # --- Never served -------------------------------------------------------
    # `^~` wins over the regex locations further down, so class/config.php can
    # never reach the PHP handler.
    # index.php is the only entry point; everything it includes is off limits.
    location ^~ /class/   { deny all; }
    location ^~ /actions/ { deny all; }
    location ^~ /views/   { deny all; }
    location ^~ /tools/   { deny all; }
    location = /config.php { deny all; }

    # .env, .git, .gitignore, .dockerignore and friends.
    location ~ /\.        { deny all; }
    location ~* \.(md|ya?ml|conf|sql|log|example|dist|bak)$ { deny all; }
    location = /Dockerfile { deny all; }
    location = /LICENSE    { deny all; }

    # --- Static assets ------------------------------------------------------
    location ^~ /data/ {
        # `^~` disables the regex locations, including the one that blocks
        # hidden files, so the data updater's working directories have to be
        # excluded right here.
        location ~ ^/data/(backups/|\.) { deny all; }

        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /img/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /preview/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Stylesheet, scripts, icons and the vendored Bootstrap bundle.
    location ^~ /assets/ {
        expires 1h;
        access_log off;
        try_files $uri =404;
    }

    # --- Application --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Without this, a URL such as /unknown.php/x.php would be handed to PHP.
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $forwarded_https;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
