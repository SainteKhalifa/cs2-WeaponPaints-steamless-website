# Vhost du gestionnaire de skins. TLS et redirection HTTP sont assurés par
# Traefik en amont : ici on ne sert que du HTTP en clair sur le réseau interne.

# Traefik termine le TLS, l'application doit quand même se savoir en HTTPS.
map $http_x_forwarded_proto $forwarded_https {
    default '';
    https    on;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.php;

    charset utf-8;
    client_max_body_size 2m;

    # Les listes de skins et de stickers pèsent plusieurs mégaoctets et sont
    # récupérées en fetch par le navigateur : sans compression, chaque
    # ouverture de la fenêtre de stickers transfère près de 4 Mo.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/css image/svg+xml application/javascript;

    # Ping de php-fpm, utilisé par le HEALTHCHECK de l'image. php-fpm compare
    # ping.path à REQUEST_URI, que seul fastcgi_params renseigne : sans cette
    # inclusion, la requête ne correspond à aucun ping et php-fpm tente
    # d'exécuter un script vide, ce qui répond 404.
    location = /healthz {
        access_log off;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
    }

    # --- Ce qui ne doit jamais sortir -------------------------------------
    # `^~` l'emporte sur les emplacements en expression régulière plus bas :
    # class/config.php ne peut donc pas être exécuté par le bloc PHP.
    location ^~ /class/ { deny all; }
    location ^~ /tools/ { deny all; }

    # .env, .git, .gitignore, .dockerignore…
    location ~ /\.        { deny all; }
    location ~* \.(md|ya?ml|conf|sql|log|example|dist|bak)$ { deny all; }
    location = /Dockerfile { deny all; }
    location = /LICENSE    { deny all; }

    # --- Contenus statiques -----------------------------------------------
    location ^~ /data/ {
        # `^~` neutralise les emplacements en expression régulière, y compris
        # celui qui bloque les fichiers cachés : les dossiers de travail du
        # script de mise à jour doivent donc être exclus ici même.
        location ~ ^/data/(backups/|\.) { deny all; }

        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /img/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /preview/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location = /style.css   { expires 1h; }
    location = /favicon.svg { expires 7d; access_log off; }

    # --- Application -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Sans ceci, une URL comme /inconnu.php/x.php serait passée à PHP.
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $forwarded_https;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
